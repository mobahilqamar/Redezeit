<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redezeit OBS Output</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .timer-wrap {
      width: 680px;
      height: 128px;
      box-sizing: border-box;
      border: 5px solid #b9823a;
      border-radius: 26px;
      background: linear-gradient(135deg, #0b3a30, #062820);
      box-shadow: 0 0 24px rgba(185, 130, 58, 0.45), inset 0 0 25px rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      color: #f6d38b;
      transition: background 0.35s linear;
    }

    .label {
      width: 350px;
      font-size: 30px;
      font-weight: 600;
      color: #f1c878;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .time {
      width: 225px;
      font-size: 66px;
      font-weight: 900;
      color: #f6d38b;
      letter-spacing: 3px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="timerBox" class="timer-wrap">
    <div id="label" class="label">Redezeit</div>
    <div id="time" class="time">02:00</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="shared.js"></script>
  <script>
    const box = document.getElementById("timerBox");
    const label = document.getElementById("label");
    const time = document.getElementById("time");
    let data = null;

    timerRef.on("value", snapshot => {
      data = snapshot.val();
      render();
    });

    function render() {
      if (!data) return;

      const remaining = getRemainingSeconds(data);
      time.innerText = formatTime(remaining);

      if (data.status === "running" && remaining >= 0) {
        label.innerText = "Redezeit läuft";
        box.style.background = "linear-gradient(135deg, #0b3a30, #062820)";
        return;
      }

      if (data.status === "running" && remaining < 0) {
        label.innerText = "Redezeit überschritten";
        const overtime = Math.abs(remaining);
        const intensity = Math.min(overtime / 90, 1);
        const red = Math.round(95 + intensity * 130);
        const green = Math.round(58 - intensity * 42);
        box.style.background = `linear-gradient(135deg, rgb(${red}, ${green}, 34), rgb(${Math.min(red + 35, 255)}, 18, 18))`;
        return;
      }

      label.innerText = "Redezeit";
      box.style.background = "linear-gradient(135deg, #0b3a30, #062820)";
    }

    setInterval(render, 250);
  </script>
</body>
</html>
